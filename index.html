<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISFB Blood Donation App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-red-600 text-center mb-4">ISFB রক্তদান অ্যাপ</h1>
        <p class="text-gray-600 text-center mb-6">রক্তদাতা খুঁজুন বা রক্তদাতা হিসেবে নাম নথিভুক্ত করুন</p>
        
        <!-- ব্লাড গ্রুপ সার্চ -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">রক্তের গ্রুপ খুঁজুন</label>
            <select id="searchGroup" class="w-full border rounded-lg p-2 mb-2">
                <option value="">সকল গ্রুপ</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
        </div>

        <div id="donorList" class="space-y-3">
            <p class="text-center text-gray-500">বর্তমানে কোনো রক্তদাতা পাওয়া যায়নি</p>
        </div>
    </div>
</body>
          </html>
