<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISFB রক্তদান অ্যাপ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-red-600 text-center mb-6">ISFB রক্তদান অ্যাপ</h1>

        <!-- ট্যাব বা সেকশন -->
        <div class="space-y-8">
            <!-- রক্তদাতা রেজিস্ট্রেশন -->
            <section class="bg-red-50 p-4 rounded-lg border border-red-200">
                <h2 class="text-lg font-bold text-red-700 mb-3 text-center">রক্তদাতা হিসেবে যোগ দিন</h2>
                <form id="donorForm" class="space-y-2">
                    <input type="text" id="name" placeholder="আপনার নাম" required class="w-full p-2 border rounded text-sm">
                    <input type="tel" id="phone" placeholder="ফোন নম্বর" required class="w-full p-2 border rounded text-sm">
                    <select id="bloodGroup" required class="w-full p-2 border rounded text-sm">
                        <option value="">রক্তের গ্রুপ</option>
                        <option value="A+">A+</option><option value="A-">A-</option>
                        <option value="B+">B+</option><option value="B-">B-</option>
                        <option value="O+">O+</option><option value="O-">O-</option>
                        <option value="AB+">AB+</option><option value="AB-">AB-</option>
                    </select>
                    <button type="submit" class="w-full bg-red-600 text-white font-bold py-2 rounded">নিবন্ধন করুন</button>
                </form>
            </section>

            <!-- জরুরি রক্তের অনুরোধ -->
            <section class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                <h2 class="text-lg font-bold text-blue-700 mb-3 text-center">জরুরি রক্তের অনুরোধ</h2>
                <form id="requestForm" class="space-y-2">
                    <input type="text" id="reqPatient" placeholder="রোগীর নাম" required class="w-full p-2 border rounded text-sm">
                    <input type="text" id="reqHospital" placeholder="হাসপাতালের নাম" required class="w-full p-2 border rounded text-sm">
                    <select id="reqBlood" required class="w-full p-2 border rounded text-sm">
                        <option value="">প্রয়োজনীয় রক্তের গ্রুপ</option>
                        <option value="A+">A+</option><option value="B+">B+</option>
                        <option value="O+">O+</option><option value="AB+">AB+</option>
                    </select>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded">অনুরোধ পোস্ট করুন</button>
                </form>
            </section>
        </div>

        <div id="donorList" class="mt-8 space-y-3">
            <h2 class="font-bold text-gray-700">রক্তদাতাদের তালিকা:</h2>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
